<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>案例讲解视频 · 一窗之后</title>
<link rel="icon" href="../hall/favicon.ico">
<style>
  :root { --bg: #071226; --ink: #eaf3ff; --sub: #9fb9d6; --line: rgba(120, 190, 255, .28); --cyan: #5fd3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse 90% 70% at 50% 0%, #15376d 0%, #0c1d3d 45%, var(--bg) 100%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 16px 40px; }
  nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  nav a { color: var(--cyan); text-decoration: none; }
  h1 { font-size: clamp(20px, 3vw, 28px); margin: 0; letter-spacing: .05em; }
  video { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); border-radius: 12px; display: block; }
  p { color: var(--sub); font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="../">← 返回首页</a>
    <h1>案例数据可视化讲解视频</h1>
    <a href="../hall/材质智治大厅.html?view=hall#overview">进入展示大屏 →</a>
  </nav>
  <video controls playsinline preload="metadata" poster="../img/video-poster.jpg">
    <source src="explainer.mp4" type="video/mp4">
    你的浏览器不支持视频播放，请<a href="explainer.mp4">下载视频</a>观看。
  </video>
  <p>时长 6 分 05 秒，带旁白与字幕。片中数字均在画面左下角标注来源与口径。</p>
</div>
</body>
</html>
